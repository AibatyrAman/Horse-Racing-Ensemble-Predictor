# ─────────────────────────────────────────────────────────────
#  TJK Paneli (FastAPI) — nginx location bloğu (aizho.me/ganyan)
# ─────────────────────────────────────────────────────────────
#  Kullanım: Bu bloğu mevcut /etc/nginx/sites-available/aizho.me
#  server { ... } bloğunun İÇİNE yapıştır.
#
#  Şifre koruması istenirse auth_basic satırlarını aç (# kaldır).
#  NOT: Uygulama hem /ganyan hem kök altında yanıt verdiğinden
#  proxy_pass'ın sonunda /ganyan/ olup olmaması fark etmez.
# ─────────────────────────────────────────────────────────────

    # /ganyan (eğik çizgisiz) → /ganyan/ (relatif URL'ler için şart)
    location = /ganyan { return 301 /ganyan/; }

    # ── TJK Tahmin Paneli (/ganyan) ──────────────────────────
    # Opsiyonel: Şifre koruması
    # auth_basic           "TJK Paneli";
    # auth_basic_user_file /etc/nginx/.htpasswd_ganyan;

    location /ganyan/ {
        proxy_pass http://127.0.0.1:8501/ganyan/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Canlı log akışı (SSE) için ŞART: buffer'lama kapalı, uzun timeout
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
